services:
  # Web API — accepts multipart uploads, spawns the Python PDF pipeline
  # inline, streams the produced PDF back as the response body. Single
  # service, no queue, no object storage. The dyno does the work itself.
  - type: web
    name: no-mi-kos-back
    runtime: docker
    dockerfilePath: ./Dockerfile
    dockerContext: .
    plan: free
    envVars:
      - key: PORT
        value: 3001
      # Set in the Render dashboard (sync:false = not committed):
      - key: FRONTEND_URL
        sync: false
